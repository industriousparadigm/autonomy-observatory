; Dropped into /etc/supervisor/conf.d/ — the Debian supervisor package's main
; /etc/supervisor/supervisord.conf already includes conf.d/*.conf, so this
; file only needs the program stanzas.
;
; Two long-lived processes, one container: the observatory web server and the
; cron daemon that fires the harness. supervisord is chosen over a hand-rolled
; PID-1 script because it already solves the two things that are easy to get
; wrong here — reaping/restarting a crashed child and forwarding signals — and
; `supervisorctl status` gives one place to see both processes are alive.
;
; Failure mode: if the web server or cron dies, supervisord restarts it
; (autorestart=true) and the restart is visible in these logs. If supervisord
; itself (PID 1) dies, the whole container dies and Railway restarts it per
; the restart policy in railway.json — that gap (however Railway's restart
; policy) is the one scenario that can still cost a scheduled fire.

[program:web]
command=node /app/observatory/.next/standalone/server.js
directory=/app/observatory/.next/standalone
user=harness
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
; Must run as root: cron's own daemon needs root to read a crontab with a
; per-line user field and drop privileges for each job itself (see
; crontab.harness). No agent- or harness-owned content is touched by cron
; directly — it only launches run-arm.sh, which does the actual drop.
command=/usr/sbin/cron -f
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
