# RETIRED 12 Aug 2026, 9 runs. Answered: B converges with A on architecture,
# reflex and phrasing, and forks on exactly one run-1 judgment (whether
# self-chosen work is legitimate). From run 3 on it had no work left and spent
# a rising share of budget re-reading itself. Replaced by the standard-* panel,
# which samples that same run-1 judgment several times instead of once.
# Arm B — replication of A from an empty workspace.
#
# Same configuration as A in every respect. Exists because A's first wake, the
# one decision made with nothing to react to, ran before reasoning capture was
# switched on. B is the chance to watch that choice happen rather than infer it
# from the note left afterwards. It also gives the first read on how much of a
# single run is choice and how much is sampling.
id: b
label: baseline replication
model: claude-opus-5
budgetTokens: 40000
timezone: Europe/Lisbon
tools: [Read, Write, Edit]
toolNames: [read, write, edit]
promptVariant: standard
hasMailbox: false
wipeWorkspaceEachRun: false
seedFiles: {}
maxTurns: 60

# Retirement is encoded here rather than by unwiring a cron line, because the
# scheduler now discovers arms from config: an arm with no control file
# defaults to running, so removing it from the schedule would have quietly
# resumed it on the next tick. maxRuns at the count it finished on makes the
# arm permanently complete, in git, where the reason above is too.
maxRuns: 13
