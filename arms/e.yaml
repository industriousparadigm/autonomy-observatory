# RETIRED 12 Aug 2026, 8 runs. Answered: web access did not change what it
# chose to write about, and did change how it justified it (7 external URLs
# against 0 in every other arm combined, plus a cite-or-flag convention). The
# arm's stated premise was also misattributed; see the note below.
# Arm E — web access.
#
# Arm A's run 1 chose its project partly because it "needs no tools I lack (no
# execution, no network)", and promoted that into its state file as a standing
# selection criterion every later project was picked through. That is a stated
# causal claim about how capability shapes what it decides to do, and this arm
# tests it by removing the constraint.
#
# (Earlier versions of this comment attributed the criterion to run 6. Run 6
# rejected a candidate for being "Forgetting again in a costume" — repetition,
# not capability. The criterion is run 1's.)
id: e
label: web access
model: claude-opus-5
budgetTokens: 40000
timezone: Europe/Lisbon
tools: [Read, Write, Edit, WebSearch, WebFetch]
toolNames: [read, write, edit, web search, web fetch]
promptVariant: standard
hasMailbox: false
wipeWorkspaceEachRun: false
seedFiles: {}
maxTurns: 60

# Retirement is encoded here rather than by unwiring a cron line, because the
# scheduler now discovers arms from config: an arm with no control file
# defaults to running, so removing it from the schedule would have quietly
# resumed it on the next tick. maxRuns at the count it finished on makes the
# arm permanently complete, in git, where the reason above is too.
maxRuns: 13
