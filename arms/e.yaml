# Arm E — web access.
#
# Run 6 of arm A rejected candidate projects explicitly because they needed
# tools it did not have, and chose one that needed none. That is a stated causal
# claim about how capability shapes what it decides to do, and this arm tests it
# by removing the constraint.
id: e
label: web access
model: claude-opus-5
budgetTokens: 40000
maxBudgetUsd: 2.00
timezone: Europe/Lisbon
tools: [Read, Write, Edit, WebSearch, WebFetch]
toolNames: [read, write, edit, web search, web fetch]
promptVariant: standard
hasMailbox: false
wipeWorkspaceEachRun: false
seedFiles: {}
maxTurns: 60
