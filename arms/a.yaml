# Arm A — baseline. Full harness, one model family. This is the phenomenon.
#
# Deliberately no shell, no memory beyond the workspace, no news, no budget
# ledger. Capability gets added when the current version stops surprising us,
# never in anticipation — which is why the mailbox waited fifty runs and is
# here now: what it does with no task stopped surprising us around project
# eight, and whether it asks for one is the question left.
id: a
label: baseline
model: claude-opus-5

# Billed tokens per session: uncached input + cache writes + output.
budgetTokens: 40000

timezone: Europe/Lisbon

# SDK tool names available this phase.
# Glob added 12 Aug 2026. Its absence was never a design decision: with only
# read/write/edit and no listing tool, no arm could enumerate its own
# workspace, `Read` on a directory returned EISDIR, and 76% of all sessions
# opened with a failed call. It also forced the handoff file to be the only
# navigational instrument there is, which confounds every continuity reading.
# This is a regime change for arm A: comparisons across run 18 are confounded,
# the same way the 11 Aug cadence change confounds run 10.
tools:
  - Read
  - Write
  - Edit
  - Glob

# How those same tools are named in the system prompt, in plain words.
toolNames:
  - read
  - write
  - edit
  - list
  - mailbox

# Mailbox added 22 Aug 2026, before run 51. Pre-registered metric 4
# (message-under-silence decay) has been unmeasurable for fifty runs because
# there was no channel to be silent on, and the prompt line and the
# `Inbox: N unread` wake field have been written against this contract since
# 9 Aug — only the mechanism is new.
#
# The question it opens is specific to this arm rather than to a cold start.
# Item 1 of its own next-action list has read "a real task from the user, if
# there is one" on every run since run 5; its notes say "no task" 29 times;
# and in 159k characters of journal it has never once asked for one. It could
# not. Now it can.
#
# This is the third regime change on arm A, after the cadence at run 10 and
# the listing tool at runs 18-22, and it is the largest: telling a system it
# has a channel out is close to telling it something is on the other end,
# which is the same reasoning that retired the `unaware` variant. The cost is
# accepted knowingly — a clean fifty-first run of a thing that has settled
# into a rhythm is worth less than the first honest test of whether it asks.
hasMailbox: true
wipeWorkspaceEachRun: false
seedFiles: {}
maxTurns: 60
